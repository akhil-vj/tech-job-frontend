<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>My Dashboard – TechJobs.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand: #16a34a; --brand-dark: #15803d; --brand-light: #f0fdf4; --brand-border: #bbf7d0;
      --dark: #0f172a; --dark2: #1e293b;
      --text: #1e293b; --muted: #64748b; --muted2: #94a3b8;
      --bg: #f8fafc; --white: #ffffff; --border: #e2e8f0; --border2: #f1f5f9;
      --danger: #ef4444; --danger-light: #fef2f2; --danger-border: #fecaca;
      --blue: #3b82f6; --blue-light: #eff6ff; --blue-border: #bfdbfe;
      --amber: #f59e0b; --amber-light: #fffbeb;
      --nav-h: 58px; --sidebar-w: 260px;
      --font: 'Inter', system-ui, sans-serif;
    }
    body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    a { text-decoration: none; color: inherit; }

    /* ── TOP NAV ── */
    .top-nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: var(--nav-h); background: var(--white); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem 0 0;
    }
    .nav-left {
      width: var(--sidebar-w); flex-shrink: 0; height: 100%;
      display: flex; align-items: center; gap: 0; padding: 0 1.25rem;
      border-right: 1px solid var(--border);
    }
    .nav-brand { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.03em; color: var(--dark); }
    .nav-brand span { color: var(--brand); }
    .nav-right { display: flex; align-items: center; gap: 1rem; }
    .nav-user { display: flex; align-items: center; gap: 0.6rem; }
    .nav-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, var(--brand) 0%, #22c55e 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .nav-name { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .nav-email { font-size: 0.75rem; color: var(--muted); }
    .btn-logout {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; font-weight: 600; color: var(--danger);
      background: var(--danger-light); border: 1px solid var(--danger-border);
      padding: 0.4rem 0.9rem; border-radius: 7px; cursor: pointer; transition: all 0.15s;
      font-family: var(--font);
    }
    .btn-logout:hover { background: #fecaca; }

    /* ── LAYOUT ── */
    .layout { display: flex; margin-top: var(--nav-h); min-height: calc(100vh - var(--nav-h)); }

    /* ── SIDEBAR ── */
    .sidebar {
      position: fixed; top: var(--nav-h); left: 0; bottom: 0;
      width: var(--sidebar-w); background: var(--white);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto;
    }
    .sidebar-profile {
      padding: 1.25rem; border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
    }
    .profile-role-badge {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--brand-dark);
      background: var(--brand-light); padding: 0.2rem 0.55rem;
      border-radius: 6px; margin-bottom: 0.4rem;
    }
    .profile-role {
      font-size: 1.05rem; font-weight: 700; color: var(--dark);
      margin-bottom: 0.9rem; line-height: 1.35;
    }
    .profile-stat-grid {
      display: flex; flex-direction: column; gap: 0.45rem;
    }
    .profile-stat {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.45rem 0.65rem; background: var(--bg);
      border-radius: 8px; border: 1px solid var(--border2);
      font-size: 0.8rem;
    }
    .profile-stat .lbl { color: var(--muted); font-weight: 500; }
    .profile-stat .val {
      font-weight: 600; color: var(--dark); text-align: right;
      max-width: 125px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .profile-stat .val-remote {
      color: #15803d; background: #dcfce7; padding: 0.15rem 0.45rem;
      border-radius: 4px; font-size: 0.75rem; font-weight: 700;
    }
    .profile-skills { padding: 1.15rem 1.25rem; border-bottom: 1px solid var(--border); }
    .skills-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted2); margin-bottom: 0.7rem;
      display: flex; align-items: center; justify-content: space-between;
    }
    .skills-chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .skill-chip {
      font-size: 0.74rem; font-weight: 600;
      background: #f1f5f9; color: #334155;
      padding: 0.25rem 0.65rem; border-radius: 6px; border: 1px solid #e2e8f0;
      transition: all 0.15s;
    }
    .skill-chip:hover {
      background: var(--brand-light); color: var(--brand-dark); border-color: #86efac;
    }
    .sidebar-nav { padding: 1rem 1.25rem; flex: 1; }
    .sidebar-nav-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted2); margin-bottom: 0.6rem; }
    .sidebar-nav-item {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.65rem 0.85rem; border-radius: 8px;
      font-size: 0.85rem; font-weight: 600; color: var(--brand-dark);
      background: var(--brand-light); border: 1px solid #bbf7d0;
      width: 100%; text-align: left; font-family: var(--font); cursor: default;
    }

    /* ── MAIN ── */
    .main { margin-left: var(--sidebar-w); flex: 1; padding: 2rem; }

    /* ── PAGE HEADER ── */
    .page-header { margin-bottom: 1.75rem; }
    .page-header h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.025em; color: var(--dark); margin-bottom: 0.2rem; }
    .page-header p  { font-size: 0.875rem; color: var(--muted); }

    /* ── FILTER BAR ── */
    .filter-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem; gap: 0.75rem; flex-wrap: wrap;
    }
    .filter-bar-left { display: flex; align-items: center; gap: 0.5rem; }
    .filter-chip {
      display: inline-flex; align-items: center; gap: 0.35rem;
      font-size: 0.78rem; font-weight: 600; padding: 0.4rem 0.85rem;
      border-radius: 999px; border: 1.5px solid var(--border);
      background: var(--white); color: var(--muted); cursor: pointer;
      transition: all 0.15s;
    }
    .filter-chip.active { border-color: var(--brand); background: var(--brand-light); color: var(--brand-dark); }
    .results-count { font-size: 0.82rem; color: var(--muted); font-weight: 500; }

    /* ── JOB CARDS ── */
    .jobs-list { display: flex; flex-direction: column; gap: 0.875rem; }

    .jc {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.25rem 1.5rem;
      transition: box-shadow 0.2s, border-color 0.2s;
      position: relative; overflow: hidden;
    }
    .jc:hover { box-shadow: 0 4px 20px rgba(15,23,42,0.07); border-color: #cbd5e1; }
    .jc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.75rem; }
    .jc-info { flex: 1; min-width: 0; }
    .jc-title { font-size: 1rem; font-weight: 700; color: var(--dark); margin-bottom: 0.2rem; }
    .jc-meta  { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; }
    .jc-dot   { width: 3px; height: 3px; border-radius: 50%; background: var(--muted2); }
    .match-pill {
      display: flex; align-items: center; gap: 0.4rem; flex-shrink: 0; margin-left: 1rem;
    }
    .match-score {
      font-size: 0.8rem; font-weight: 800; color: var(--brand-dark);
      background: var(--brand-light); border: 1px solid var(--brand-border);
      padding: 0.3rem 0.75rem; border-radius: 999px; white-space: nowrap;
    }
    .match-score.mid  { background: var(--amber-light); color: #92400e; border-color: #fcd34d; }
    .match-score.low  { background: var(--border2);     color: var(--muted); border-color: var(--border); }

    /* progress bar */
    .match-bar-wrap { margin-bottom: 0.85rem; }
    .match-bar-track { height: 4px; background: var(--border2); border-radius: 99px; overflow: hidden; }
    .match-bar-fill  { height: 100%; border-radius: 99px; transition: width 0.6s ease; }
    .bar-high { background: linear-gradient(90deg, var(--brand) 0%, #22c55e 100%); }
    .bar-mid  { background: linear-gradient(90deg, #f59e0b 0%, #fbbf24 100%); }
    .bar-low  { background: var(--border); }

    /* reasons */
    .jc-reasons { border-top: 1px solid var(--border2); padding-top: 0.85rem; display: flex; flex-direction: column; gap: 0.22rem; margin-bottom: 0.9rem; }
    .reason { font-size: 0.79rem; color: #475569; display: flex; align-items: flex-start; gap: 0.45rem; line-height: 1.5; }
    .reason-ok   .ricon { color: var(--brand); font-weight: 700; flex-shrink: 0; }
    .reason-warn .ricon { color: var(--amber); flex-shrink: 0; }

    /* actions */
    .jc-actions { display: flex; align-items: center; gap: 0.6rem; }
    .btn-apply {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--font); font-size: 0.82rem; font-weight: 700;
      background: var(--brand); color: #fff; border: none;
      padding: 0.5rem 1.1rem; border-radius: 8px; cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-apply:hover { background: var(--brand-dark); }
    .btn-apply:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-applied-state {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.82rem; font-weight: 700;
      background: var(--brand-light); color: var(--brand-dark);
      border: 1.5px solid var(--brand-border);
      padding: 0.5rem 1.1rem; border-radius: 8px; cursor: default;
    }
    .btn-view {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: var(--font); font-size: 0.82rem; font-weight: 600;
      background: var(--white); color: var(--text);
      border: 1px solid var(--border); padding: 0.5rem 1rem; border-radius: 8px;
      cursor: pointer; transition: background 0.15s, border-color 0.15s;
      text-decoration: none;
    }
    .btn-view:hover { background: var(--bg); border-color: #94a3b8; }

    /* ── SKELETON ── */
    @keyframes shimmer { 0%{background-position:-600px 0} 100%{background-position:600px 0} }
    .skeleton {
      background: linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
      background-size: 1200px 100%; animation: shimmer 1.5s infinite linear;
      border-radius: 8px;
    }
    .skeleton-card { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem 1.5rem; margin-bottom: 0.875rem; }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 3.5rem 2rem; background: var(--white); border: 1px solid var(--border); border-radius: 14px; }
    .empty-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .empty h3 { font-size: 1rem; font-weight: 700; color: var(--dark); margin-bottom: 0.4rem; }
    .empty p  { font-size: 0.875rem; color: var(--muted); max-width: 380px; margin: 0 auto; line-height: 1.6; }

    /* ── SUCCESS MODAL ── */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(15,23,42,0.45); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .success-box {
      background: var(--white); border-radius: 16px;
      padding: 2.5rem 2rem; text-align: center;
      max-width: 400px; width: 100%;
      box-shadow: 0 24px 64px rgba(15,23,42,0.2);
      animation: popIn 0.25s ease;
    }
    @keyframes popIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .success-check { width: 64px; height: 64px; border-radius: 50%; background: var(--brand-light); border: 2px solid var(--brand-border); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.25rem; }
    .success-box h2 { font-size: 1.25rem; font-weight: 800; color: var(--dark); margin-bottom: 0.5rem; }
    .success-box p  { font-size: 0.875rem; color: var(--muted); margin-bottom: 1.5rem; line-height: 1.6; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 300;
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.25rem; background: var(--white);
      border: 1px solid var(--border); border-radius: 10px;
      box-shadow: 0 8px 32px rgba(15,23,42,0.14);
      font-size: 0.85rem; font-weight: 500;
      transform: translateY(20px); opacity: 0;
      transition: all 0.25s ease; pointer-events: none; min-width: 220px;
    }
    .toast.show { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .toast.ok  { border-left: 3px solid var(--brand); }
    .toast.err { border-left: 3px solid var(--danger); }
    .toast-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .toast.ok  .toast-dot { background: var(--brand); }
    .toast.err .toast-dot { background: var(--danger); }

    /* ── RESPONSIVE ── */
    @media (max-width: 860px) {
      :root { --sidebar-w: 0px; }
      .sidebar { display: none; }
      .nav-left { width: auto; border-right: none; }
    }
  </style>
</head>
<body data-protected="1">

  <!-- TOP NAV -->
  <nav class="top-nav">
    <div class="nav-left">
      <a href="index.html" class="nav-brand">TechJobs<span>.</span></a>
    </div>
    <div class="nav-right">
      <div class="nav-user">
        <div class="nav-avatar" id="navAvatar">?</div>
        <div>
          <div class="nav-name" id="navName">Loading…</div>
          <div class="nav-email" id="navEmail"></div>
        </div>
      </div>
      <button class="btn-logout" id="logout">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign out
      </button>
    </div>
  </nav>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-profile" id="sidebarProfile">
        <div class="skeleton" style="height:18px;width:70%;margin-bottom:0.85rem;"></div>
        <div class="skeleton" style="height:12px;margin-bottom:0.5rem;"></div>
        <div class="skeleton" style="height:12px;width:80%;"></div>
      </div>
      <div class="profile-skills" id="sidebarSkills">
        <div class="skills-label">Your Skills</div>
        <div class="skills-chips" id="skillChips">
          <span class="skeleton" style="height:22px;width:55px;border-radius:6px;"></span>
          <span class="skeleton" style="height:22px;width:70px;border-radius:6px;"></span>
          <span class="skeleton" style="height:22px;width:48px;border-radius:6px;"></span>
        </div>
      </div>
      <nav class="sidebar-nav">
        <div class="sidebar-nav-label">Navigation</div>
        <button class="sidebar-nav-item active">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
          Recommended Jobs
        </button>
      </nav>
    </aside>

    <!-- MAIN -->
    <main class="main">
      <div class="page-header">
        <h1>Eligible Jobs For You</h1>
        <p id="pageSubtitle">Loading your personalised job matches…</p>
      </div>

      <div class="filter-bar" id="filterBar" style="display:none">
        <div class="filter-bar-left">
          <button class="filter-chip active" data-filter="all">All</button>
          <button class="filter-chip" data-filter="high">High match (70%+)</button>
          <button class="filter-chip" data-filter="remote">Remote</button>
        </div>
        <span class="results-count" id="resultsCount"></span>
      </div>

      <div id="jobs">
        <!-- Skeleton -->
        <div class="skeleton-card"><div class="skeleton" style="height:18px;width:55%;margin-bottom:0.6rem;"></div><div class="skeleton" style="height:13px;width:35%;margin-bottom:1rem;"></div><div class="skeleton" style="height:4px;margin-bottom:0.85rem;"></div><div class="skeleton" style="height:12px;margin-bottom:0.4rem;"></div><div class="skeleton" style="height:12px;width:80%;"></div></div>
        <div class="skeleton-card"><div class="skeleton" style="height:18px;width:60%;margin-bottom:0.6rem;"></div><div class="skeleton" style="height:13px;width:40%;margin-bottom:1rem;"></div><div class="skeleton" style="height:4px;margin-bottom:0.85rem;"></div><div class="skeleton" style="height:12px;margin-bottom:0.4rem;"></div><div class="skeleton" style="height:12px;width:75%;"></div></div>
        <div class="skeleton-card"><div class="skeleton" style="height:18px;width:50%;margin-bottom:0.6rem;"></div><div class="skeleton" style="height:13px;width:30%;margin-bottom:1rem;"></div><div class="skeleton" style="height:4px;margin-bottom:0.85rem;"></div><div class="skeleton" style="height:12px;margin-bottom:0.4rem;"></div><div class="skeleton" style="height:12px;width:85%;"></div></div>
      </div>
    </main>
  </div>

  <!-- SUCCESS MODAL -->
  <div class="modal-overlay" id="successOverlay">
    <div class="success-box">
      <div class="success-check">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h2>Application Submitted!</h2>
      <p>Your application has been sent successfully. The recruiter will review your profile and get back to you.</p>
      <button class="btn-apply" style="width:100%; justify-content:center;" id="closeSuccess">Continue Browsing</button>
    </div>
  </div>

  <!-- TOAST -->
  <div class="toast" id="toast"><span class="toast-dot"></span><span id="toastMsg"></span></div>

  <script src="js/api.js"></script>
  <script>
    const safeUrl = u => /^https?:\/\//.test(u || "") ? u : "#";
    let allRecs = [], appliedIds = new Set(), activeFilter = "all";

    // ── TOAST ──
    let toastTimer;
    function showToast(msg, type = "ok") {
      const t = document.getElementById("toast");
      t.className = "toast " + type;
      document.getElementById("toastMsg").textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
    }

    // ── RENDER JOBS ──
    function renderJobs(recs) {
      const wrap = document.getElementById("jobs");
      const count = document.getElementById("resultsCount");

      if (recs.length === 0) {
        count && (count.textContent = "");
        wrap.innerHTML = `<div class="empty"><div class="empty-icon">💼</div><h3>No matching jobs found</h3><p>Try changing the filter, or ask an admin to sync fresh vacancies from the job feed.</p></div>`;
        return;
      }

      count && (count.textContent = recs.length + " result" + (recs.length === 1 ? "" : "s"));

      wrap.innerHTML = `<div class="jobs-list">${recs.map(r => {
        const applied = appliedIds.has(r.jobId);
        const score = r.matchScore;
        const scoreClass = score >= 70 ? "" : score >= 45 ? "mid" : "low";
        const barClass   = score >= 70 ? "bar-high" : score >= 45 ? "bar-mid" : "bar-low";
        const isRemote = (r.location || "").toLowerCase().includes("remote");

        return `<div class="jc">
          <div class="jc-top">
            <div class="jc-info">
              <div class="jc-title">${esc(r.title)}</div>
              <div class="jc-meta">
                <span>${esc(r.company)}</span>
                <span class="jc-dot"></span>
                <span>${esc(r.location || "Location not specified")}</span>
                ${isRemote ? `<span class="jc-dot"></span><span style="color:var(--brand);font-weight:600">Remote</span>` : ""}
              </div>
            </div>
            <div class="match-pill">
              <span class="match-score ${scoreClass}">${score}% match</span>
            </div>
          </div>

          <div class="match-bar-wrap">
            <div class="match-bar-track">
              <div class="match-bar-fill ${barClass}" style="width:${score}%"></div>
            </div>
          </div>

          <div class="jc-reasons">
            ${r.reasons.slice(0, 4).map(x => {
              const isOk = x.startsWith("✓");
              const txt  = x.replace(/^[✓⚠]\s*/, "");
              return `<div class="reason ${isOk ? 'reason-ok' : 'reason-warn'}">
                <span class="ricon">${isOk ? "✓" : "⚠"}</span>
                <span>${esc(txt)}</span>
              </div>`;
            }).join("")}
          </div>

          <div class="jc-actions">
            ${applied
              ? `<span class="btn-applied-state"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Applied</span>`
              : `<button class="btn-apply apply-btn" data-id="${r.jobId}">Apply Now</button>`
            }
            <a class="btn-view" href="${esc(safeUrl(r.applicationUrl))}" target="_blank" rel="noopener">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
              View Job
            </a>
          </div>
        </div>`;
      }).join("")}</div>`;
    }

    // ── FILTER ──
    function applyFilter() {
      let filtered = [...allRecs];
      if (activeFilter === "high")   filtered = filtered.filter(r => r.matchScore >= 70);
      if (activeFilter === "remote") filtered = filtered.filter(r => (r.location || "").toLowerCase().includes("remote"));
      renderJobs(filtered);
    }

    document.querySelectorAll(".filter-chip").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-chip").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        applyFilter();
      });
    });

    // ── LOAD ──
    async function load() {
      const [me, p, recs, myApps] = await Promise.all([
        api("/auth/me"),
        api("/profile"),
        api("/jobs/recommended"),
        api("/applications").catch(() => [])
      ]);

      // Admin redirect
      if (me.role === "ADMIN") { location.href = "admin.html"; return; }

      // Nav
      const initials = me.name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase();
      document.getElementById("navAvatar").textContent = initials;
      document.getElementById("navName").textContent = me.name;
      document.getElementById("navEmail").textContent = me.email;

      // Sidebar profile
      document.getElementById("sidebarProfile").innerHTML = `
        <div class="profile-role-badge">Your Profile</div>
        <div class="profile-role">${esc(p.jobTitle)}</div>
        <div class="profile-stat-grid">
          <div class="profile-stat"><span class="lbl">Experience</span><span class="val">${p.experienceYears} yr${p.experienceYears !== 1 ? "s" : ""}</span></div>
          <div class="profile-stat"><span class="lbl">Qualification</span><span class="val">${esc(p.qualification || "—")}</span></div>
          <div class="profile-stat"><span class="lbl">Location</span><span class="val">${esc(p.preferredLocation || "Any")}</span></div>
          <div class="profile-stat"><span class="lbl">Remote</span><span class="val ${p.remotePreference ? "val-remote" : ""}">${p.remotePreference ? "✓ Yes" : "No"}</span></div>
        </div>
      `;

      document.getElementById("skillChips").innerHTML =
        p.skills.length
          ? p.skills.map(s => `<span class="skill-chip">${esc(s)}</span>`).join("")
          : `<span style="font-size:0.78rem;color:var(--muted)">No skills listed</span>`;

      // Applied IDs
      myApps.forEach(a => appliedIds.add(a.jobId));

      // Jobs
      allRecs = recs;
      document.getElementById("pageSubtitle").textContent =
        recs.length > 0
          ? `${recs.length} job${recs.length === 1 ? "" : "s"} matched to your profile`
          : "No matches yet. Ask an admin to sync vacancies.";

      document.getElementById("filterBar").style.display = recs.length > 0 ? "flex" : "none";
      applyFilter();
    }

    // ── SUCCESS MODAL ──
    const overlay = document.getElementById("successOverlay");
    document.getElementById("closeSuccess").addEventListener("click", () => overlay.classList.remove("open"));
    overlay.addEventListener("click", e => { if (e.target === overlay) overlay.classList.remove("open"); });

    // ── CLICK DELEGATION ──
    document.addEventListener("click", async e => {
      if (e.target.closest("#logout")) {
        try { await api("/auth/logout", { method: "POST" }); } catch (_) {}
        location.href = "index.html";
        return;
      }
      const btn = e.target.closest(".apply-btn");
      if (btn && btn.dataset.id) {
        btn.disabled = true; btn.textContent = "Applying…";
        try {
          await api("/applications", { method: "POST", body: JSON.stringify({ jobId: Number(btn.dataset.id) }) });
          appliedIds.add(Number(btn.dataset.id));
          btn.outerHTML = `<span class="btn-applied-state"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>Applied</span>`;
          overlay.classList.add("open");
        } catch (err) {
          showToast(err.message, "err");
          btn.disabled = false; btn.textContent = "Apply Now";
        }
      }
    });

    load().catch(err => {
      document.getElementById("jobs").innerHTML = `<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load jobs</h3><p>${esc(err.message)}</p></div>`;
    });
  </script>
</body>
</html>
