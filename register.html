<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>Job Seeker Registration - TechJobs</title>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">TechJobs.</a>
    <div class="nav-links">
      <span class="nav-hint">Already have an account?</span>
      <a href="login.html">Sign in</a>
    </div>
  </nav>

  <div class="auth-container auth-card">
    <div class="auth-header">
      <h2>Job Seeker Registration</h2>
      <p class="auth-subtitle">Create your account and find your dream job!</p>
    </div>

    <form id="regForm" novalidate>
      <!-- 1. Full Name & 2. Age (Two columns on desktop) -->
      <div class="form-row-2">
        <div class="input-group">
          <label for="name">Full Name <span class="req">*</span></label>
          <input id="name" name="name" type="text" placeholder="Enter your full name" required autocomplete="name">
          <div class="field-error" id="name-error"></div>
        </div>

        <div class="input-group">
          <label for="age">Age <span class="req">*</span></label>
          <input id="age" name="age" type="number" min="16" max="99" placeholder="e.g. 24" required>
          <div class="field-error" id="age-error"></div>
        </div>
      </div>

      <!-- 3. Gender & 4. Email Address -->
      <div class="form-row-2">
        <div class="input-group">
          <label for="gender">Gender <span class="req">*</span></label>
          <select id="gender" name="gender" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
            <option value="Prefer not to say">Prefer not to say</option>
          </select>
          <div class="field-error" id="gender-error"></div>
        </div>

        <div class="input-group">
          <label for="email">Email Address <span class="req">*</span></label>
          <input id="email" name="email" type="email" placeholder="name@example.com" required autocomplete="email">
          <div class="field-error" id="email-error"></div>
        </div>
      </div>

      <!-- 5. Phone Number -->
      <div class="input-group">
        <label for="phone">Phone Number <span class="req">*</span></label>
        <input id="phone" name="phone" type="tel" placeholder="e.g. +91 9876543210" required autocomplete="tel">
        <div class="field-error" id="phone-error"></div>
      </div>

      <!-- 6. Highest Qualification -->
      <div class="input-group">
        <label for="qualification">Highest Qualification <span class="req">*</span></label>
        <select id="qualification" name="qualification" required>
          <option value="" disabled selected>Select Qualification</option>
          <option value="SSLC">SSLC</option>
          <option value="Higher Secondary">Higher Secondary</option>
          <option value="Diploma">Diploma</option>
          <option value="ITI">ITI</option>
          <option value="Degree">Degree</option>
          <option value="BCA / BSc Computer Science">BCA / BSc Computer Science</option>
          <option value="B.Tech / BE">B.Tech / BE</option>
          <option value="MCA / MSc">MCA / MSc</option>
          <option value="Other">Other</option>
        </select>
        <div class="field-error" id="qualification-error"></div>
      </div>

      <!-- 7. Preferred Job Location -->
      <div class="input-group">
        <label for="preferredLocation">Preferred Job Location</label>
        <input id="preferredLocation" name="preferredLocation" type="text" placeholder="e.g. Kochi, Bangalore, Remote">
        <div class="field-error" id="preferredLocation-error"></div>
      </div>

      <!-- 8. Skills -->
      <div class="input-group">
        <label for="skills">Skills</label>
        <textarea id="skills" name="skills" rows="3" placeholder="e.g. Java, Python, React, SQL, Problem Solving"></textarea>
        <div class="field-error" id="skills-error"></div>
      </div>

      <!-- 9. Work Experience -->
      <div class="input-group">
        <label for="workExperience">Work Experience <span class="req">*</span></label>
        <select id="workExperience" name="workExperience" required>
          <option value="" disabled selected>Select Experience Level</option>
          <option value="Fresher">Fresher</option>
          <option value="Less than 1 year">Less than 1 year</option>
          <option value="1–3 years">1–3 years</option>
          <option value="3+ years">3+ years</option>
        </select>
        <div class="field-error" id="workExperience-error"></div>
      </div>

      <!-- 10. Create Password -->
      <div class="input-group">
        <label for="password">Create Password <span class="req">*</span></label>
        <input id="password" name="password" type="password" minlength="6" placeholder="At least 6 characters" required autocomplete="new-password">
        <div class="field-error" id="password-error"></div>
      </div>

      <!-- Submit Button -->
      <button class="btn btn-primary-full" type="submit" id="regSubmitBtn">Create Account</button>
      <div id="msg" style="display:none;"></div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
