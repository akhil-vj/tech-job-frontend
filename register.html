<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>Register - TechJobs</title>
</head>
<body class="itjob-body">
  <!-- Minimal Top Nav -->
  <nav class="itjob-nav">
    <div class="itjob-nav-container">
      <a href="index.html" class="itjob-brand">TechJobs<span>.</span></a>
    </div>
  </nav>

  <!-- Main Register Section (itjobcell layout) -->
  <main class="itjob-wrapper">
    <div class="itjob-card">
      <div class="itjob-grid">
        <!-- Left Banner Column with Authentic Illustration -->
        <div class="itjob-left-banner">
          <div class="itjob-img-box">
            <img src="assets/reg-img.webp" alt="Register with TechJobs" class="itjob-reg-img">
          </div>
          <div class="itjob-banner-copy">
            <h3>Find Your Dream Tech Job</h3>
            <p>Connect with hundreds of hiring tech companies across India and worldwide.</p>
          </div>
        </div>

        <!-- Right Form Column -->
        <div class="itjob-right-form">
          <h1 class="itjob-form-title">Register Now</h1>
          <p class="itjob-form-subtitle">Fill in the details below to register as a job seeker.</p>

          <form id="regForm" novalidate>
            <!-- First Name & Last Name (Full Name split for itjobcell look) -->
            <div class="itjob-row">
              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label for="fname">First Name<sup>*</sup> :</label>
                  <input type="text" id="fname" name="fname" class="itjob-control" placeholder="First Name" required autocomplete="given-name">
                  <div class="field-error" id="name-error"></div>
                </div>
              </div>
              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label for="lname">Last Name<sup>*</sup> :</label>
                  <input type="text" id="lname" name="lname" class="itjob-control" placeholder="Last Name" required autocomplete="family-name">
                </div>
              </div>
            </div>

            <!-- Hidden input to keep existing backend name field sync -->
            <input type="hidden" id="name" name="name">

            <!-- Gender & Work Status / Fresher (itjobcell radio style) -->
            <div class="itjob-row">
              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label>Gender<sup>*</sup> :</label>
                  <div class="itjob-radio-bar">
                    <label class="itjob-radio-label">
                      <input type="radio" name="genderRadio" value="Male" checked>
                      <span>Male</span>
                    </label>
                    <label class="itjob-radio-label">
                      <input type="radio" name="genderRadio" value="Female">
                      <span>Female</span>
                    </label>
                    <label class="itjob-radio-label">
                      <input type="radio" name="genderRadio" value="Other">
                      <span>Other</span>
                    </label>
                  </div>
                  <input type="hidden" id="gender" name="gender" value="Male">
                  <div class="field-error" id="gender-error"></div>
                </div>
              </div>

              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label for="age">Age<sup>*</sup> :</label>
                  <input type="number" id="age" name="age" min="16" max="99" class="itjob-control" placeholder="Age (e.g. 24)" required>
                  <div class="field-error" id="age-error"></div>
                </div>
              </div>
            </div>

            <!-- Email & Mobile Number -->
            <div class="itjob-row">
              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label for="email">Email ID<sup>*</sup> :</label>
                  <input type="email" id="email" name="email" class="itjob-control" placeholder="Email Address" required autocomplete="email">
                  <div class="field-error" id="email-error"></div>
                </div>
              </div>

              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label for="phone">Mobile Number<sup>*</sup> :</label>
                  <input type="tel" id="phone" name="phone" class="itjob-control" placeholder="Mobile Number" required autocomplete="tel">
                  <div class="field-error" id="phone-error"></div>
                </div>
              </div>
            </div>

            <!-- Highest Qualification & Work Experience -->
            <div class="itjob-row">
              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label for="qualification">Highest Qualification<sup>*</sup> :</label>
                  <select id="qualification" name="qualification" class="itjob-control itjob-select" required>
                    <option value="" disabled selected>Select Qualification</option>
                    <option value="B.Tech / BE">B.Tech / BE</option>
                    <option value="BCA / BSc Computer Science">BCA / BSc Computer Science</option>
                    <option value="MCA / MSc">MCA / MSc</option>
                    <option value="Degree">Degree</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Higher Secondary">Higher Secondary</option>
                    <option value="SSLC">SSLC</option>
                    <option value="Other">Other</option>
                  </select>
                  <div class="field-error" id="qualification-error"></div>
                </div>
              </div>

              <div class="itjob-col-6">
                <div class="itjob-form-group">
                  <label for="workExperience">Work Experience<sup>*</sup> :</label>
                  <select id="workExperience" name="workExperience" class="itjob-control itjob-select" required>
                    <option value="" disabled selected>Select Experience Level</option>
                    <option value="Fresher">Fresher</option>
                    <option value="Less than 1 year">Less than 1 year</option>
                    <option value="1–3 years">1–3 years</option>
                    <option value="3+ years">3+ years</option>
                  </select>
                  <div class="field-error" id="workExperience-error"></div>
                </div>
              </div>
            </div>

            <!-- Location -->
            <div class="itjob-form-group">
              <label for="preferredLocation">Location / Preferred City :</label>
              <input type="text" id="preferredLocation" name="preferredLocation" class="itjob-control" placeholder="e.g. Trivandrum, Kochi, Bangalore, Remote">
              <div class="field-error" id="preferredLocation-error"></div>
            </div>

            <!-- Key Skills -->
            <div class="itjob-form-group">
              <label for="skills">Key Skills :</label>
              <textarea id="skills" name="skills" class="itjob-control itjob-textarea" rows="2" placeholder="e.g. Java, Python, React, SQL, HTML, CSS"></textarea>
              <div class="field-error" id="skills-error"></div>
            </div>

            <!-- Password -->
            <div class="itjob-form-group">
              <label for="password">Create Password<sup>*</sup> :</label>
              <div class="itjob-password-wrapper">
                <input type="password" id="password" name="password" minlength="6" class="itjob-control" placeholder="At least 6 characters" required autocomplete="new-password">
                <button type="button" class="itjob-pwd-toggle" id="pwdToggleBtn" aria-label="Toggle password visibility">
                  <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
              <div class="field-error" id="password-error"></div>
            </div>

            <!-- Terms & Submit Button -->
            <div class="itjob-action-wrap">
              <button class="itjob-submit-btn" type="submit" id="regSubmitBtn">
                Register Free
              </button>
              <div id="msg" style="display:none;"></div>
            </div>

            <div class="itjob-footer-text">
              Already registered? <a href="login.html">Click here to Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Sync First Name + Last Name to hidden #name for API backend compatibility
    const fname = document.getElementById("fname");
    const lname = document.getElementById("lname");
    const fullNameHidden = document.getElementById("name");
    function syncName() {
      fullNameHidden.value = (fname.value.trim() + " " + lname.value.trim()).trim();
    }
    if (fname && lname) {
      fname.addEventListener("input", syncName);
      lname.addEventListener("input", syncName);
    }

    // Gender radios sync to hidden #gender
    const genderRadios = document.querySelectorAll('input[name="genderRadio"]');
    const genderHidden = document.getElementById("gender");
    genderRadios.forEach(r => {
      r.addEventListener("change", (e) => {
        if (genderHidden) genderHidden.value = e.target.value;
      });
    });
  </script>
</body>
</html>
