<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>Login - TechJobs</title>
</head>
<body class="itjob-body">
  <!-- Minimal Top Nav -->
  <nav class="itjob-nav">
    <div class="itjob-nav-container">
      <a href="index.html" class="itjob-brand">TechJobs<span>.</span></a>
      <div class="itjob-nav-actions">
        <a href="register.html" class="itjob-nav-btn">Register Free</a>
      </div>
    </div>
  </nav>

  <!-- Main Login Section (itjobcell layout) -->
  <main class="itjob-wrapper itjob-wrapper--login">
    <div class="itjob-card">
      <div class="itjob-grid itjob-grid--login">
        <!-- Left Banner Column with Authentic Illustration -->
        <div class="itjob-left-banner itjob-left-banner--login">
          <div class="itjob-img-box itjob-img-box--login">
            <img src="assets/sign-in-img.webp" alt="Sign in to TechJobs" class="itjob-reg-img">
          </div>
          <div class="itjob-banner-copy">
            <h3>Login and Find 100+ Job Options</h3>
            <p>Build a robust profile and get notified of job openings through TechJobs, adhering to your skills and picks.</p>
          </div>
        </div>

        <!-- Right Form Column -->
        <div class="itjob-right-form itjob-right-form--login">
          <div class="itjob-login-header">
            <h1 class="itjob-form-title">Welcome Back</h1>
            <p class="itjob-form-subtitle">Please enter your credentials to login to your account.</p>
          </div>

          <form id="loginForm" novalidate>
            <!-- Email -->
            <div class="itjob-form-group">
              <label for="email">Email ID<sup>*</sup> :</label>
              <input type="email" id="email" name="email" class="itjob-control" placeholder="Enter your registered email" autocomplete="username" required>
            </div>

            <!-- Password -->
            <div class="itjob-form-group">
              <label for="password">Password<sup>*</sup> :</label>
              <div class="itjob-password-wrapper">
                <input type="password" id="password" name="password" class="itjob-control" placeholder="Enter your password" autocomplete="current-password" required>
                <button type="button" class="itjob-pwd-toggle" id="loginPwdToggleBtn" aria-label="Toggle password visibility">
                  <svg id="loginEyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg id="loginEyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>

            <!-- Remember me checkbox -->
            <div class="itjob-checkbox-row">
              <label class="itjob-checkbox-label">
                <input type="checkbox" id="remember" name="remember">
                <span>Remember me for 30 days</span>
              </label>
            </div>

            <!-- Submit Button -->
            <div class="itjob-action-wrap">
              <button class="itjob-submit-btn" type="submit">
                Login Now
              </button>
              <div id="msg" style="display:none;"></div>
            </div>

            <div class="itjob-footer-text">
              Don't have an account? <a href="register.html">Register as Job Seeker</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const msgDiv = document.getElementById("msg");
    const observer = new MutationObserver(() => {
      if(msgDiv.textContent.trim() !== '') msgDiv.style.display = 'block';
    });
    observer.observe(msgDiv, {childList: true, characterData: true, subtree: true});

    const loginPwdBtn = document.getElementById("loginPwdToggleBtn");
    const loginPwdInput = document.getElementById("password");
    const eyeIcon = document.getElementById("loginEyeIcon");
    const eyeOffIcon = document.getElementById("loginEyeOffIcon");
    if (loginPwdBtn && loginPwdInput) {
      loginPwdBtn.addEventListener("click", () => {
        const isPwd = loginPwdInput.type === "password";
        loginPwdInput.type = isPwd ? "text" : "password";
        eyeIcon.style.display = isPwd ? "none" : "block";
        eyeOffIcon.style.display = isPwd ? "block" : "none";
      });
    }
  </script>
</body>
</html>
