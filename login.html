<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
  <title>Sign in - TechJobs</title>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">TechJobs.</a>
    <div class="nav-links">
      <span style="color: var(--text-muted); font-size: 0.875rem;">Don't have an account?</span>
      <a href="register.html">Sign up</a>
    </div>
  </nav>

  <div class="auth-container">
    <div class="text-center" style="margin-bottom: 2rem;">
      <h2>Welcome back</h2>
      <p style="margin:0;">Enter your credentials to access your account.</p>
    </div>
    
    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="name@example.com" autocomplete="username" required>
      </div>
      
      <div class="input-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="checkbox-group" style="margin-bottom: 0.5rem;">
        <input id="remember" name="remember" type="checkbox">
        <label for="remember">Remember me for 30 days</label>
      </div>
      
      <button class="btn" type="submit">Sign In</button>
      <div id="msg" style="display:none;"></div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // small tweak to make msg div display block when text is set
    const originalShow = window.show;
    const msgDiv = document.getElementById("msg");
    const observer = new MutationObserver(() => {
      if(msgDiv.textContent.trim() !== '') msgDiv.style.display = 'block';
    });
    observer.observe(msgDiv, {childList: true, characterData: true, subtree: true});
  </script>
</body>
</html>
