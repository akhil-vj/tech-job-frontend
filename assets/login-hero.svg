<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="540" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="40" y1="90" x2="500" y2="90" />
    <line x1="40" y1="180" x2="500" y2="180" />
    <line x1="40" y1="270" x2="500" y2="270" />
  </g>

  <!-- Main Dashboard Card -->
  <g transform="translate(60, 45)">
    <!-- Backing Card -->
    <rect width="420" height="260" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header of Mock UI -->
    <rect width="420" height="42" rx="12" fill="#1e293b" />
    <!-- Window Dots -->
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <!-- Mock Search Bar -->
    <rect x="80" y="11" width="180" height="20" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <circle cx="95" cy="21" r="4" stroke="#64748b" stroke-width="1.5" fill="none" />

    <!-- Job Match Card 1 -->
    <g transform="translate(24, 62)">
      <rect width="372" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Company Icon -->
      <rect x="14" y="14" width="44" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <path d="M28 26 L36 34 L44 26" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Title & Details -->
      <rect x="70" y="18" width="140" height="12" rx="3" fill="#f1f5f9" />
      <rect x="70" y="38" width="90" height="8" rx="2" fill="#64748b" />
      <!-- Match Badge -->
      <rect x="280" y="24" width="76" height="24" rx="12" fill="#0369a1" />
      <text x="318" y="40" fill="#e0f2fe" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">98% Match</text>
    </g>

    <!-- Job Match Card 2 -->
    <g transform="translate(24, 150)">
      <rect width="372" height="72" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <!-- Company Icon -->
      <rect x="14" y="14" width="44" height="44" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <rect x="28" y="28" width="16" height="16" rx="3" stroke="#818cf8" stroke-width="2" fill="none" />
      <!-- Title & Details -->
      <rect x="70" y="18" width="160" height="12" rx="3" fill="#f1f5f9" />
      <rect x="70" y="38" width="110" height="8" rx="2" fill="#64748b" />
      <!-- Match Badge -->
      <rect x="280" y="24" width="76" height="24" rx="12" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
      <text x="318" y="40" fill="#c7d2fe" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">Verified</text>
    </g>

    <!-- Success Floating Pill -->
    <g transform="translate(240, 215)">
      <rect width="170" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <circle cx="20" cy="18" r="8" fill="#10b981" />
      <path d="M16 18 L19 21 L24 15" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />
      <text x="36" y="22" fill="#f1f5f9" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600">Application Sent</text>
    </g>
  </g>
</svg>
